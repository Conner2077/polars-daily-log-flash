# 复制为 config.toml 后只需改这三段。
# 其余配置项都有默认值，一般不用改。

[paths]
pdl_root = "~/path/to/auto_daily_log"
# pdl_python = "~/path/to/auto_daily_log/.venv/bin/python"
# pdl_log = "~/.local/bin/pdl-log"
# pdl_server_config = "~/.polars-daily-log/config.yaml"

[claude]
settings = "~/path/to/cc_config/ds.json"
# bin = "claude"
# timeout_seconds = 600

[jira]
# Jira 项目固定为 PLS，工单号模式固定为 PLS-\d+，无需配置
label = "YourMainLabel"

