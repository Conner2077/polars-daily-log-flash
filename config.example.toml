# 复制为 config.toml 后只需要改这两段。
# Jira 项目固定为 PLS，工单号模式固定为 PLS-\d+，无需配置。

[claude]
settings = "~/path/to/cc_config/ds.json"
# bin = "claude"
# timeout_seconds = 600

[jira]
label = "YourMainLabel"
# 默认凭据文件：data/jira_auth.json（由 ./scripts/jira_login.sh 生成）
# credentials = "data/jira_auth.json"

# 可选覆盖示例：
# [report]
# max_body_chars = 200
#
# [agents]
# output_dir = "data/AI总结"
